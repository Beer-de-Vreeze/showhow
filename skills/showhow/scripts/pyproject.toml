[project]
name = "showhow"
version = "0.1.0"
description = "Development tooling for the /showhow skill."
requires-python = ">=3.11"
# The scripts used in every run need only Pillow; the music analysis pulls the heavy stack.
dependencies = [
  "pillow>=10.1",
]

[dependency-groups]
music = [
  "librosa>=0.10.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[tool.uv]
package = false

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- three.js pinned, loaded as ES modules the way the HyperFrames registry's 3D blocks load it. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <style>
      /* The theme: scene3d reads --paper, --ink, --accent (the showhow frame preset) and tints everything from them. */
      :root, #root { --paper: #F3ECDD; --ink: #23201B; --accent: #0F6E6A; --muted: #5B5547; }
      html, body { margin: 0; background: var(--paper); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: "Segoe UI", system-ui, sans-serif; }
      #stage, #flat { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #flat { opacity: 0; }
      #title { position: absolute; left: 150px; top: 56px; padding: 8px 20px; border-radius: 10px; background: var(--paper); font-size: 44px; font-weight: 700; color: var(--ink); }
      .s3d-leaders { position: absolute; inset: 0; pointer-events: none; }
      .s3d-leaders line { stroke: var(--ink); stroke-width: 2.5; }
      .s3d-leaders circle { fill: var(--accent); stroke: var(--ink); stroke-width: 2; }
      .s3d-label { position: absolute; left: 0; top: 0; padding: 10px 18px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 40px; font-weight: 600; white-space: nowrap; }
    </style>
  </head>
  <body>
    <!-- data-params is the plan's Params: object. Coordinates are stated in the plan; nothing is geocoded. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080"
         data-params='{"kind": "globe", "country": "BRA", "route": [{"name": "Seville", "lat": 37.39, "lon": -5.98, "side": "right"}, {"name": "Rio de Janeiro", "lat": -22.91, "lon": -43.17, "side": "left"}]}'>
      <canvas id="stage" width="1920" height="1080"></canvas>
      <canvas id="flat" width="1920" height="1080"></canvas>
      <div id="title">Seville to Rio de Janeiro</div>
    </div>
    <script src="assets/gsap/gsap.min.js"></script><!-- local GSAP (README), never a CDN at render time -->
    <script>
      // HyperFrames' contract wants a registered timeline; the 3D frame itself is drawn from hf-seek.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { createStage, fitToRoot, onSeek, ease } from "./assets/scene3d/scene3d.js";
      import { buildGlobe } from "./assets/scene3d/globe.js";

      const root = document.getElementById("root");
      const P = JSON.parse(root.dataset.params);

      onSeek("globe-route", async () => {
        const { width, height } = fitToRoot(root); // sizes both canvases, so the flat map matches the stage
        const stage = createStage({ canvas: document.getElementById("stage"), width, height, viewHeight: (10 * height) / Math.min(width, height), view: "front" });
        const globe = await buildGlobe(stage, root, P, "./assets/scene3d/data/ne_110m_admin_0_countries.min.geojson");
        globe.flatMap(document.getElementById("flat"));
        const { cut, cutFade } = globe.timing;
        const flat = document.getElementById("flat");
        return (t) => {
          globe.pose(t);
          // Match cut: the flat locator map is the globe's final frame, so a short dissolve hides the swap.
          flat.style.opacity = ease((t - cut) / cutFade);
        };
      });
    </script>
  </body>
</html>
